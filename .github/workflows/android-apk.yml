name: Android APK

on:
  push:
    branches: [master]
    paths:
      - "android-native/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint, and build the native app
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Name the installable APK
        run: cp android-native/app/build/outputs/apk/debug/app-debug.apk SortScope-native-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SortScope-native-android
          path: SortScope-native-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SortScope-android-reports
          path: |
            android-native/app/build/reports/tests/
            android-native/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
